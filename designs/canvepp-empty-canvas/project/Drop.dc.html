<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>拖放提示</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    .empty-canvas {
      background-image: radial-gradient(circle, #dedede 0.7px, transparent 0.9px);
      background-size: 30px 30px;
    }
    .empty-drop:hover { border-color: #999 !important; background: #f6f6f6 !important; }
    .empty-drop-new:hover { background: #ededed !important; }
    .empty-drop:focus-visible, .empty-drop-new:focus-visible {
      outline: 2px solid #767676;
      outline-offset: 3px;
    }
    .empty-drop-new:is(:hover, :focus-visible)::after {
      position: absolute;
      z-index: 1;
      top: calc(100% + 7px);
      left: 50%;
      translate: -50% 0;
      padding: 5px 8px;
      border-radius: 6px;
      background: #242424;
      color: #fff;
      font: 12px/16px -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
      content: attr(data-tip);
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</helmet>
<main class="empty-canvas" aria-label="空画布" style="width:840px;height:624px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:0 20px 24px;background-color:#fff;color:#262626;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;">
  <div style="display:flex;flex-direction:column;align-items:center;gap:12px;width:288px;max-width:100%;">
    <button type="button" class="empty-drop" aria-label="导入图片" aria-describedby="drop-instruction" style="width:100%;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:16px;border:1px dashed #bdbdbd;border-radius:13px;background:#fbfbfb;color:#262626;font:inherit;cursor:pointer;">
      <span style="width:36px;height:36px;display:grid;place-items:center;border-radius:8px;background:#efefef;color:#404040;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5m5-5v12"></path>
        </svg>
      </span>
      <span id="drop-instruction" style="display:flex;flex-direction:column;gap:3px;">
        <span style="font-size:15px;font-weight:550;line-height:21px;">将图片拖入画布</span>
        <span style="font-size:12px;line-height:18px;color:#626262;">或点击选择文件</span>
      </span>
    </button>
    <button type="button" class="empty-drop-new" aria-label="新建图片" data-tip="新建图片 · ⌘ N" style="display:grid;place-items:center;position:relative;width:44px;height:44px;padding:0;border:0;border-radius:9px;background:#f5f5f5;color:#333;cursor:pointer;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14"></path>
      </svg>
    </button>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":840,"height":624}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
