const page = "images";
const variant = "justified";
const isCanvas = page === "canvases";
const byName = new Intl.Collator("zh-Hans-CN-u-co-pinyin", { numeric: true });
const day = 24 * 60 * 60 * 1000;
const dayStart = new Date();
dayStart.setHours(0, 0, 0, 0);

function timestamp(daysBack, hour = 10, minute = 0) {
  const date = new Date(dayStart);
  date.setDate(date.getDate() - daysBack);
  date.setHours(hour, minute, 0, 0);
  return date.getTime();
}

function dateText(value, includeTime = false) {
  const date = new Date(value);
  const label = date.toLocaleDateString("zh-CN", { month: "long", day: "numeric" });
  const clock = date.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false });
  return includeTime ? label + " " + clock : label;
}

const imageLayout = window.CanveppGalleryImageLayout;
const importOrder = imageLayout.withStressImages(items);
const collections = collectionSeeds.map(seed => ({
  id: seed.id,
  name: seed.name,
  updated: timestamp(seed.updated, seed.hour, seed.minute),
  created: timestamp(seed.created),
  opened: timestamp(seed.opened, 9),
  images: importOrder.filter(item => item.group === seed.id)
}));

class Component extends DCLogic {
  state = {
    sortBy: isCanvas ? "updated" : "recent", query: "", boardId: collections[0].id,
    photoId: importOrder[0].id, detail: false, dialog: false, actual: false, opened: {},
    wallWidth: variant === "split" ? 650 : 870
  };

  beginBoard(id) {
    this.returnTop = this.galleryScroll?.scrollTop ?? 0;
    this.setState(s => ({
      boardId: id,
      detail: true,
      opened: { ...s.opened, [id]: Date.now() }
    }));
  }

  pickBoard(id) {
    if (isCanvas && variant === "split" && !this.state.detail) {
      this.setState({ boardId: id });
    } else {
      this.beginBoard(id);
    }
  }

  goBack() {
    this.restoreScroll = true;
    this.setState({ detail: false });
  }

  showPhoto(id, preview = true) {
    this.setState({ photoId: id, dialog: preview, actual: false });
  }

  bindPreview = node => { this.preview = node; };

  toggleActual = () => {
    if (this.preview) this.preview.scrollTo(0, 0);
    this.setState(s => ({ actual: !s.actual }));
  };

  bindScroll = (node) => { this.galleryScroll = node; };

  bindWall = (node) => {
    if (node === this.wall) return;
    this.observer?.disconnect();
    this.wall = node;
    if (!node) return;
    this.observer = new ResizeObserver(entries => {
      const width = Math.floor(entries[0].contentRect.width);
      if (width > 0 && width !== this.state.wallWidth) this.setState({ wallWidth: width });
    });
    this.observer.observe(node);
  };

  componentDidUpdate() {
    if (this.restoreScroll && this.galleryScroll) {
      this.galleryScroll.scrollTop = this.returnTop ?? 0;
      this.restoreScroll = false;
    }
  }

  componentWillUnmount() {
    this.observer?.disconnect();
  }

  renderVals() {
    const s = this.state;
    const query = s.query.trim().toLocaleLowerCase();
    const matches = text => !query || text.toLocaleLowerCase().includes(query);
    const activeDate = board => s.sortBy === "opened" ? s.opened[board.id] ?? board.opened : board[s.sortBy] ?? board.updated;
    const sortedBoards = collections.filter(board => !isCanvas || matches(board.name)).sort((a, b) => {
      if (s.sortBy === "name") return byName.compare(a.name, b.name);
      return activeDate(b) - activeDate(a) || byName.compare(a.name, b.name);
    });
    const selectedBoard = sortedBoards.find(board => board.id === s.boardId) ?? sortedBoards[0] ?? collections[0];
    const detailBoard = collections.find(board => board.id === s.boardId) ?? selectedBoard;
    const boardData = board => ({
      ...board,
      selected: variant === "split" && board.id === selectedBoard.id,
      a11y: (variant === "split" ? "预览画布 · " : "打开画布 · ") + board.name,
      sidebarLabel: "进入画布 · " + board.name,
      cover: board.images.slice(0, 3),
      empty: !board.images.length,
      count: board.images.length + " 张",
      updatedAt: dateText(board.updated, true),
      mainDate: dateText(activeDate(board), true),
      choose: () => this.pickBoard(board.id),
      open: () => this.beginBoard(board.id),
      photos: board.images.map(img => ({ ...img, open: () => this.showPhoto(img.id) }))
    });

    const timeGroup = board => {
      const age = Math.floor((dayStart.getTime() - activeDate(board) + day - 1) / day);
      return age <= 0 ? "今天" : age <= 6 ? "近 7 天" : "更早";
    };
    const timeline = ["今天", "近 7 天", "更早"].map(title => ({
      title, boards: sortedBoards.filter(board => timeGroup(board) === title).map(boardData)
    })).filter(group => group.boards.length > 0);

    if (variant === "timeline" && s.sortBy === "name" && sortedBoards.length) {
      timeline.splice(0, timeline.length, { title: "按名称", boards: sortedBoards.map(boardData) });
    }

    const availablePhotos = importOrder.filter(picture => {
      const board = collections.find(entry => entry.id === picture.group);
      return matches([picture.name, picture.title, picture.artist, board.name, picture.note, picture.w + " × " + picture.h].join(" "));
    });
    if (s.sortBy === "name") {
      availablePhotos.sort((a, b) => byName.compare(a.name, b.name));
    } else if (s.sortBy === "size") {
      availablePhotos.sort((a, b) => b.w * b.h - a.w * a.h || byName.compare(a.name, b.name));
    }
    const previewList = s.detail ? detailBoard.images : availablePhotos;
    const selectedPhoto = previewList.find(picture => picture.id === s.photoId) ?? previewList[0] ?? importOrder[0];
    const photoData = picture => {
      const board = collections.find(entry => entry.id === picture.group);
      return {
        ...picture,
        board: board.name,
        dimensions: picture.w + " × " + picture.h + " px",
        hint: picture.name + " · " + picture.w + " × " + picture.h + " px",
        tiny: Math.max(picture.w, picture.h) <= 64,
        detailAspect: "aspect-ratio:" + picture.w + "/" + picture.h,
        previewLimit: Math.max(picture.w, picture.h) <= 64
          ? "max-width:min(100%," + picture.w * 2 + "px);max-height:min(100%," + picture.h * 2 + "px);image-rendering:pixelated"
          : "",
        a11y: (variant === "split" ? "查看图片详情 · " : "预览图片 · ") + picture.name,
        selected: variant === "split" && picture.id === selectedPhoto.id,
        choose: () => this.showPhoto(picture.id, variant !== "split"),
        expand: () => this.showPhoto(picture.id)
      };
    };
    const photos = availablePhotos.map(photoData);
    const layout = imageLayout.arrange(photos, s.wallWidth, variant);
    const photo = photoData(selectedPhoto);
    const position = previewList.indexOf(selectedPhoto);
    const step = offset => {
      const picture = previewList[position + offset];
      if (picture) this.showPhoto(picture.id);
    };
    const title = s.detail ? detailBoard.name : isCanvas ? "全部画布" : "全部图片";
    return {
      ...s, title,
      appearance: this.props.appearance ?? "system",
      count: s.detail ? detailBoard.images.length + " 张" : isCanvas ? sortedBoards.length + " 个画布" : availablePhotos.length + " 张",
      sidebar: collections.map(boardData),
      boards: sortedBoards.map(boardData),
      groups: timeline,
      layoutTiles: layout.tiles, wallStyle: "height:" + layout.height + "px",
      activeBoard: boardData(selectedBoard), detailBoard: boardData(detailBoard), photo,
      previewStyle: s.actual ? "" : photo.previewLimit,
      scaleLabel: s.actual ? "100%" : "适合窗口",
      scaleAction: s.actual ? "适合窗口" : "查看原始像素",
      bindPreview: this.bindPreview, toggleActual: this.toggleActual,
      showList: !s.detail, showDetail: s.detail, showDialog: s.dialog,
      showBoards: sortedBoards.length > 0, noBoards: sortedBoards.length === 0,
      showPhotos: photos.length > 0, noPhotos: photos.length === 0,
      activePhotoNumber: position + 1 + " / " + previewList.length,
      showTools: !s.detail, showBack: s.detail,
      filter: e => this.setState({ query: e.currentTarget.value }),
      updateSort: e => this.setState({ sortBy: e.currentTarget.value }),
      bindScroll: this.bindScroll, bindWall: this.bindWall,
      back: () => this.goBack(),
      closePhoto: () => this.setState({ dialog:false }),
      previousPhoto: () => step(-1), nextPhoto: () => step(1),
      noPrevious: position <= 0, noNext: position >= previewList.length - 1,
      interceptKey: e => {
        if (!s.dialog) return;
        if (e.key === "Escape") this.setState({ dialog:false });
        if (e.key === "ArrowLeft") step(-1);
        if (e.key === "ArrowRight") step(1);
      }
    };
  }
}
