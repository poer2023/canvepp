<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>居中图标</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    .empty-canvas {
      background-image: radial-gradient(circle, #dedede 0.7px, transparent 0.9px);
      background-size: 30px 30px;
    }
    .empty-action:hover { background: #f0f0f0 !important; }
    .empty-action--primary:hover { background: #383838 !important; }
    .empty-action:focus-visible { outline: 2px solid #767676; outline-offset: 3px; }
    .empty-action:is(:hover, :focus-visible)::after {
      position: absolute;
      z-index: 1;
      top: calc(100% + 7px);
      left: 50%;
      translate: -50% 0;
      padding: 5px 8px;
      border-radius: 6px;
      background: #242424;
      color: #fff;
      font: 12px/16px -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
      content: attr(data-tip);
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</helmet>
<main class="empty-canvas" aria-label="空画布" style="width:840px;height:624px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:0 20px 24px;background-color:#fff;color:#262626;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;">
  <div style="display:flex;flex-direction:column;align-items:center;gap:13px;">
    <div aria-hidden="true" style="display:flex;align-items:center;gap:6px;width:96px;height:64px;box-sizing:border-box;padding:6px;background:#f2f2f2;border:1px solid #e5e5e5;border-radius:10px;">
      <div style="width:9px;height:100%;background:#e4e4e4;border-radius:4px;"></div>
      <div style="display:grid;place-items:center;flex:1;height:100%;border:1px solid #e8e8e8;background:#fff;border-radius:5px;color:#696969;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <path d="m21 15-5-5L5 21"></path>
        </svg>
      </div>
    </div>
    <p style="margin:0;font-size:15px;font-weight:500;line-height:22px;color:#555;">空画布</p>
    <div style="display:flex;align-items:center;gap:8px;">
      <button type="button" class="empty-action empty-action--primary" aria-label="导入图片" data-tip="导入图片 · ⌘ O" style="display:grid;place-items:center;position:relative;width:46px;height:44px;padding:0;border:0;border-radius:9px;background:#252525;color:#fff;cursor:pointer;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5m5-5v12"></path>
        </svg>
      </button>
      <button type="button" class="empty-action" aria-label="新建图片" data-tip="新建图片 · ⌘ N" style="display:grid;place-items:center;position:relative;width:44px;height:44px;padding:0;border:0;border-radius:9px;background:transparent;color:#333;cursor:pointer;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M12 5v14M5 12h14"></path>
        </svg>
      </button>
    </div>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":840,"height":624}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
