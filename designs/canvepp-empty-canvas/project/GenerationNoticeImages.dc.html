<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>B · 图片预览</title>
  <script src="./support.js"></script>
  <link rel="stylesheet" href="/_blob/647f288bb2baaf16595c2e0f9527fa71">
</head>
<body>
<x-dc>
<helmet><style>body { margin: 0; }</style></helmet>
<main class="notice-sheet" data-theme="{{theme}}">
  <header class="sheet-header">
    <div>
      <h1>图片预览</h1>
      <p>通知内最多展示三张样图，多组完成时优先展示不同组。</p>
    </div>
    <div class="appearance-control" role="group" aria-label="通知主题">
      <button type="button" aria-pressed="{{isLight}}" onClick="{{light}}">浅色</button>
      <button type="button" aria-pressed="{{isDark}}" onClick="{{dark}}">深色</button>
    </div>
  </header>

  <div class="notice-matrix">
    <div></div>
    <div class="platform-heading"><h2>macOS</h2><span>图片附件</span></div>
    <div class="platform-heading"><h2>Windows</h2><span>内嵌图片</span></div>

    <div class="scenario-name"><strong>单组单张</strong><span>1 组 · 1 张</span></div>
    <div class="desktop-sample macos">
      <button class="notice-card" type="button" onClick="{{openOne}}">
        <span class="notice-attribution"><span class="brand-mark"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><rect x="4.5" y="4.5" width="9" height="9" rx="1.5"/><path d="M2.5 10V4a1.5 1.5 0 0 1 1.5-1.5h6"/></svg></span>Canvepp<span class="age">刚刚</span></span>
        <span class="notification-with-thumb">
          <span><strong class="notification-title">已生成 1 张图片</strong><span class="notification-body">已保存到「海岸色稿」</span></span>
          <span class="image-attachment single"><img alt="马赛湾色稿" src="/_blob/24fd3e198f230a8c004fa137a6da0174"></span>
        </span>
      </button>
    </div>
    <div class="desktop-sample windows">
      <button class="notice-card" type="button" onClick="{{openOne}}">
        <span class="notice-attribution"><span class="brand-mark"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><rect x="4.5" y="4.5" width="9" height="9" rx="1.5"/><path d="M2.5 10V4a1.5 1.5 0 0 1 1.5-1.5h6"/></svg></span>Canvepp<span class="age">刚刚</span></span>
        <span><strong class="notification-title">已生成 1 张图片</strong><span class="notification-body">已保存到「海岸色稿」</span></span>
        <span class="image-attachment single"><img alt="马赛湾色稿" src="/_blob/4d263165acc629723540ab0895a5b9b0"></span>
      </button>
    </div>

    <div class="scenario-name"><strong>单组多张</strong><span>1 组 · 4 张</span></div>
    <div class="desktop-sample macos">
      <button class="notice-card" type="button" onClick="{{openSet}}">
        <span class="notice-attribution"><span class="brand-mark"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><rect x="4.5" y="4.5" width="9" height="9" rx="1.5"/><path d="M2.5 10V4a1.5 1.5 0 0 1 1.5-1.5h6"/></svg></span>Canvepp<span class="age">刚刚</span></span>
        <span class="notification-with-thumb">
          <span><strong class="notification-title">已生成 4 张图片</strong><span class="notification-body">海岸色稿 · 预览其中 3 张</span></span>
          <span class="image-attachment multi">
            <img alt="马赛湾" src="/_blob/24fd3e198f230a8c004fa137a6da0174">
            <img alt="海浪" src="/_blob/b76ccf0710b8e4b32e778a45e5398a0c">
            <img alt="水岸" src="/_blob/06c51e77de4ac5e231f2a17bb6948cd5">
          </span>
        </span>
      </button>
    </div>
    <div class="desktop-sample windows">
      <button class="notice-card" type="button" onClick="{{openSet}}">
        <span class="notice-attribution"><span class="brand-mark"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><rect x="4.5" y="4.5" width="9" height="9" rx="1.5"/><path d="M2.5 10V4a1.5 1.5 0 0 1 1.5-1.5h6"/></svg></span>Canvepp<span class="age">刚刚</span></span>
        <span><strong class="notification-title">已生成 4 张图片</strong><span class="notification-body">海岸色稿 · 预览其中 3 张</span></span>
        <span class="image-attachment multi">
          <img alt="马赛湾" src="/_blob/24fd3e198f230a8c004fa137a6da0174">
          <img alt="海浪" src="/_blob/b76ccf0710b8e4b32e778a45e5398a0c">
          <img alt="水岸" src="/_blob/06c51e77de4ac5e231f2a17bb6948cd5">
        </span>
      </button>
    </div>

    <div class="scenario-name"><strong>多组生成</strong><span>3 组 · 8 张</span></div>
    <div class="desktop-sample macos">
      <button class="notice-card" type="button" onClick="{{openBatch}}">
        <span class="notice-attribution"><span class="brand-mark"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><rect x="4.5" y="4.5" width="9" height="9" rx="1.5"/><path d="M2.5 10V4a1.5 1.5 0 0 1 1.5-1.5h6"/></svg></span>Canvepp<span class="age">刚刚</span></span>
        <span class="notification-with-thumb">
          <span><strong class="notification-title">生成完成 · 3 组 8 张</strong><span class="notification-body">已保存到 2 张画布</span></span>
          <span class="image-attachment multi">
            <img alt="第一组的海湾" src="/_blob/24fd3e198f230a8c004fa137a6da0174">
            <img alt="第二组的海浪" src="/_blob/b76ccf0710b8e4b32e778a45e5398a0c">
            <img alt="第三组的山丘" src="/_blob/af0e3486621c210b54932d055294051b">
          </span>
        </span>
      </button>
    </div>
    <div class="desktop-sample windows">
      <button class="notice-card" type="button" onClick="{{openBatch}}">
        <span class="notice-attribution"><span class="brand-mark"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" aria-hidden="true"><rect x="4.5" y="4.5" width="9" height="9" rx="1.5"/><path d="M2.5 10V4a1.5 1.5 0 0 1 1.5-1.5h6"/></svg></span>Canvepp<span class="age">刚刚</span></span>
        <span><strong class="notification-title">生成完成 · 3 组 8 张</strong><span class="notification-body">已保存到 2 张画布</span></span>
        <span class="image-attachment multi">
          <img alt="第一组的海湾" src="/_blob/24fd3e198f230a8c004fa137a6da0174">
          <img alt="第二组的海浪" src="/_blob/b76ccf0710b8e4b32e778a45e5398a0c">
          <img alt="第三组的山丘" src="/_blob/af0e3486621c210b54932d055294051b">
        </span>
      </button>
    </div>
  </div>

  <div class="click-destination" aria-live="polite"><strong>打开去向</strong><span>{{destination}}</span></div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":980,"height":850}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.state?.theme ?? "light";
    return {
      theme,
      isLight: theme === "light",
      isDark: theme === "dark",
      light: () => this.setState({ theme: "light" }),
      dark: () => this.setState({ theme: "dark" }),
      destination: this.state?.destination ?? "点按一条通知查看去向",
      openOne: () => this.setState({ destination: "海岸色稿 → 定位新生成的图片" }),
      openSet: () => this.setState({ destination: "海岸色稿 → 查看本组 4 张生成结果" }),
      openBatch: () => this.setState({ destination: "本批生成记录 → 3 组 · 8 张" })
    };
  }
}
</script>
</body>
</html>
