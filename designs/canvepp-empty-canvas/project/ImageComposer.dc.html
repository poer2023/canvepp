<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    .media-stage, .media-stage * { box-sizing: border-box; }
    .media-stage {
      --canvas: #fff; --grid: #dadada; --panel: #fff; --control: #f6f6f6;
      --hover: #eaeaea; --selected: #e7e7e7; --rule: #e9e9e9; --edge: #dcdcdc;
      --text: #222; --muted: #636363; --solid: #272727; --reverse: #fff;
      --disabled: #777; --danger: #941d1d; --focus: #606060;
      color: var(--text); color-scheme: light; position: relative; display: grid;
      place-items: center; overflow: hidden; margin: 0;
      background: radial-gradient(var(--grid) .65px, transparent .85px) 10px 10px / 22px 22px var(--canvas);
      font: 13px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .media-stage[data-theme="dark"] {
      --canvas: #202020; --grid: #484848; --panel: #292929; --control: #222;
      --hover: #383838; --selected: #3d3d3d; --rule: #3c3c3c; --edge: #484848;
      --text: #f3f3f3; --muted: #b4b4b4; --solid: #eee; --reverse: #171717;
      --disabled: #a3a3a3; --danger: #ffb9b9; --focus: #b4b4b4;
      color-scheme: dark;
    }
    @media (prefers-color-scheme: dark) {
      .media-stage[data-theme="system"] {
        --canvas: #202020; --grid: #484848; --panel: #292929; --control: #222;
        --hover: #383838; --selected: #3d3d3d; --rule: #3c3c3c; --edge: #484848;
        --text: #f3f3f3; --muted: #b4b4b4; --solid: #eee; --reverse: #171717;
        --disabled: #a3a3a3; --danger: #ffb9b9; --focus: #b4b4b4;
        color-scheme: dark;
      }
    }
    .media-stage :is(button,input,textarea) { font: inherit; color: inherit; }
    .media-stage button {
      border: 0; margin: 0; padding: 0; border-radius: 6px; background: transparent;
      cursor: pointer; white-space: nowrap; line-height: 1.2;
    }
    .media-stage button:disabled { color: var(--disabled); cursor: default; }
    .media-stage :is(button,input,textarea):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    .media-stage :is(button,textarea,input) { touch-action: manipulation; }
    .media-stage :is(.tool,.pill,.count-option,.preset,.tab,.menu-item,.ratio-card):hover:not(:disabled) {
      background: var(--hover); color: var(--text);
    }
    .media-stage svg { flex: none; display: block; }
    .floating-panel {
      position: relative; width: 320px; border: 1px solid var(--edge); border-radius: 13px;
      background: var(--panel); transform: translate(var(--drag-x, 0px), var(--drag-y, 0px));
    }
    .floating-panel.wide { width: 496px; }
    .chrome { min-height: 46px; padding: 4px 8px 4px 12px; }
    .panel-title { color: var(--text); font-size: 13px; font-weight: 650; }
    .drag-title {
      cursor: grab; touch-action: none; user-select: none; flex: 1; align-self: stretch;
    }
    .drag-title:active { cursor: grabbing; }
    .drag-title svg { color: var(--muted); }
    .media-stage .tool {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; color: var(--muted); flex: none;
    }
    .media-stage .pill {
      display: inline-flex; justify-content: center; align-items: center; gap: 6px;
      min-height: 30px; padding: 0 8px; color: var(--muted); font-size: 12px;
    }
    .pill svg { width: 14px; height: 14px; }
    .media-stage .primary {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 32px; padding: 0 12px; border-radius: 7px;
      background: var(--solid); color: var(--reverse); font-weight: 620; font-size: 12px;
    }
    .media-stage .primary:hover:not(:disabled) { opacity: .86; }
    .media-stage .primary:disabled { background: var(--selected); color: var(--disabled); }
    .composer-frame { border: 1px solid var(--edge); border-radius: 10px; background: var(--panel); }
    .composer {
      padding: 10px 11px; margin: 0; background: var(--control); border: 0; border-radius: 8px;
      width: 100%; resize: none; display: block; line-height: 1.6; min-width: 0;
    }
    .composer::placeholder { color: var(--muted); }
    .composer:focus-visible { outline-offset: -2px !important; }
    .composer-frame .composer { background: transparent; }
    .composer-bar {
      min-height: 43px; padding: 5px; border-top: 1px solid var(--rule);
      display: flex; align-items: center; gap: 2px;
    }
    .composer-bar .pill:first-child { margin-right: auto; }
    .composer-bar .primary { padding-inline: 9px; }
    .composer-bar .compact-dims { color: var(--text); }
    .numeric { font-variant-numeric: tabular-nums; }
    .size-row {
      min-height: 37px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
      border-bottom: 1px solid var(--rule);
    }
    .field-label { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .pixel-field {
      min-width: 0; height: 30px; padding: 0 7px; display: flex; align-items: center; flex: 1;
      gap: 4px; border-radius: 6px; background: var(--control);
    }
    .pixel-field:focus-within { outline: 1px solid var(--focus); }
    .pixel-field input {
      flex: 1; width: 0; padding: 0; border: 0; background: transparent;
      outline: none !important; font-size: 12px; font-variant-numeric: tabular-nums;
    }
    .pixel-field input[aria-invalid="true"] { color: var(--danger); }
    .unit { color: var(--muted); font-size: 11px; }
    .pixel-group { display: flex; align-items: center; gap: 5px; min-width: 0; }
    .segments { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 2px; border-radius: 7px; background: var(--control); }
    .media-stage .count-option { min-width: 25px; min-height: 25px; padding-inline: 5px; color: var(--muted); font-size: 12px; }
    .media-stage :is(.count-option,.preset)[aria-pressed="true"] { background: var(--selected); color: var(--text); font-weight: 660; }
    .ratio-grid {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px;
    }
    .media-stage .preset {
      display: flex; align-items: center; justify-content: center; gap: 4px;
      min-height: 29px; padding: 0 3px; color: var(--muted); font-size: 11px; background: var(--control);
    }
    .media-stage .free { grid-column: 1 / -1; justify-content: center; }
    .shape-box { width: 14px; height: 14px; display: inline-grid; place-items: center; flex: none; }
    .shape-box span { display: block; border: 1px solid currentColor; border-radius: 1px; }
    .media-stage .ratio-card {
      min-width: 0; height: 53px; display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 5px; border: 1px solid var(--edge); border-radius: 7px; color: var(--muted); font-size: 11px;
    }
    .media-stage .ratio-card[aria-pressed="true"] {
      color: var(--text); background: var(--control); border-color: var(--text); font-weight: 650;
    }
    .ratio-card .shape-box { width: 26px; height: 21px; }
    .popover {
      position: absolute; z-index: 3; inset-inline: 12px; bottom: 45px;
      border: 1px solid var(--edge); border-radius: 9px; padding: 9px;
      display: flex; flex-direction: column; gap: 8px; background: var(--panel);
    }
    .popover.settings-menu { left: auto; width: 147px; top: 40px; bottom: auto; }
    .popover.quantity-menu { left: auto; right: 72px; width: 145px; bottom: 42px; }
    .popover.ratio-menu-wide { left: auto; width: 252px; bottom: 92px; }
    .popover.ratio-menu-rows { bottom: 55px; }
    .media-stage .menu-item {
      min-height: 33px; display: flex; align-items: center; justify-content: flex-start; gap: 8px;
      padding-inline: 7px; font-size: 12px;
    }
    .popover .tool { width: 25px; height: 25px; }
    .preset-label { font-size: 12px; font-weight: 610; }
    .stepper { display: flex; align-items: center; justify-content: space-between; background: var(--control); border-radius: 6px; }
    .stepper output { min-width: 33px; text-align: center; font-size: 12px; }
    .stepper .tool { height: 28px; width: 27px; }
    .tabbar { display: flex; align-items: center; gap: 17px; border-bottom: 1px solid var(--edge); }
    .media-stage .tab { height: 34px; padding-inline: 2px; color: var(--muted); border-radius: 0; font-size: 12px; border-bottom: 2px solid transparent; }
    .media-stage .tab[aria-selected="true"] { color: var(--text); font-weight: 650; border-bottom-color: var(--text); }
    .receipt, .input-warning { margin: 0; padding: 0 12px 10px; color: var(--muted); font-size: 11px; }
    .input-warning { color: var(--danger); }
    .panel-confirm { border-top: 1px solid var(--rule); padding: 9px 12px; }
    .media-stage .danger { color: var(--danger); }
    .selection-proxy {
      position: absolute; top: 45px; left: 50%; transform: translateX(-50%); width: 104px; height: 74px;
      display: grid; place-items: center; border: 1px solid var(--focus); color: var(--muted); background: var(--control);
    }
    .selection-proxy i { position: absolute; width: 5px; height: 5px; background: var(--panel); border: 1px solid var(--focus); }
    .selection-proxy i:nth-child(1) { top: -3px; left: -3px; }
    .selection-proxy i:nth-child(2) { top: -3px; right: -3px; }
    .selection-proxy i:nth-child(3) { bottom: -3px; left: -3px; }
    .selection-proxy i:nth-child(4) { bottom: -3px; right: -3px; }
  </style>
</helmet>

<script type="text/x-dc" data-dc-script data-props='{"appearance":{"editor":"enum","options":["system","light","dark"],"default":"system"},"$preview":{"width":384,"height":448}}'>
const ratios = [
  { label: "1:1", w: 1, h: 1 },
  { label: "4:3", w: 4, h: 3 },
  { label: "3:4", w: 3, h: 4 },
  { label: "3:2", w: 3, h: 2 },
  { label: "2:3", w: 2, h: 3 },
  { label: "16:9", w: 16, h: 9 },
  { label: "9:16", w: 9, h: 16 },
  { label: "21:9", w: 21, h: 9 }
];

function clamp(value, lo, hi) {
  return Math.min(Math.max(value, lo), hi);
}

function validPixels(text) {
  return /^\d+$/.test(text) && Number(text) >= 64 && Number(text) <= 8192;
}

class Component extends DCLogic {
  state = {
    prompt: "雨后的街角，暖色路灯映在石板路上。右侧留给海报标题。",
    ratio: 0, width: 1024, height: 1024, widthText: "1024", heightText: "1024",
    count: 1, menu: "", tab: "prompt", status: "",
    collapsed: false, visible: true, trashed: false, confirming: false, x: 0, y: 0
  };

  dimensions(index, axis, value) {
    const pair = { width: this.state.width, height: this.state.height };
    if (index === -1) {
      pair[axis] = value;
      return pair;
    }
    const ratio = ratios[index];
    const factor = axis === "width" ? ratio.h / ratio.w : ratio.w / ratio.h;
    const primary = clamp(value, Math.max(64, Math.ceil(64 / factor)), Math.min(8192, Math.floor(8192 / factor)));
    pair[axis] = primary;
    pair[axis === "width" ? "height" : "width"] = Math.round(primary * factor);
    return pair;
  }

  pickRatio(index) {
    const { width, height } = this.dimensions(index, "width", this.state.width);
    const menu = index === -1 ? this.state.menu : "";
    this.setState({ ratio: index, width, height, widthText: String(width), heightText: String(height), menu, status: "" });
  }

  editPixels(axis, raw) {
    if (!validPixels(raw)) {
      this.setState({ [axis + "Text"]: raw, status: "" });
      return;
    }
    const { width, height } = this.dimensions(this.state.ratio, axis, Number(raw));
    this.setState({
      width, height, widthText: axis === "width" ? raw : String(width),
      heightText: axis === "height" ? raw : String(height), status: ""
    });
  }

  setCount(count) {
    this.setState({ count: clamp(count, 1, 4), menu: "", status: "" });
  }

  beginDrag(e) {
    if (e.button !== 0) return;
    const frame = e.currentTarget.closest(".media-stage");
    const stage = frame.getBoundingClientRect();
    const panel = e.currentTarget.closest(".floating-panel").getBoundingClientRect();
    const scale = stage.width / frame.offsetWidth || 1;
    this.drag = {
      px: e.clientX, py: e.clientY, x: this.state.x, y: this.state.y, scale,
      left: (stage.left + 5 - panel.left) / scale, right: (stage.right - 5 - panel.right) / scale,
      top: (stage.top + 5 - panel.top) / scale, bottom: (stage.bottom - 5 - panel.bottom) / scale
    };
    e.currentTarget.setPointerCapture(e.pointerId);
    this.setState({ menu: "" });
  }

  moveDrag(e) {
    if (!this.drag) return;
    const { px, py, x, y, scale, left, right, top, bottom } = this.drag;
    this.setState({
      x: x + clamp((e.clientX - px) / scale, left, right),
      y: y + clamp((e.clientY - py) / scale, top, bottom)
    });
  }

  renderVals() {
    const s = this.state;
    const ratio = ratios[s.ratio];
    const isValid = validPixels(s.widthText) && validPixels(s.heightText);
    const canGenerate = isValid && s.prompt.trim() !== "";
    const size = s.width + " × " + s.height;
    const countLabel = s.count + " 张";
    const select = (index) => () => this.pickRatio(index);
    const options = ratios.map((r, index) => {
      const icon = (unit) => "width:" + (r.w * unit / Math.max(r.w, r.h)) + "px;height:" + (r.h * unit / Math.max(r.w, r.h)) + "px";
      return { label: r.label, selected: index === s.ratio, choose: select(index), glyph: icon(12), thumbnail: icon(21) };
    });
    const toggle = (name) => () => this.setState({ menu: s.menu === name ? "" : name, confirming: false });
    const commitPixel = (e) => {
      if (e.key === "Enter") e.currentTarget.blur();
    };
    return {
      appearance: this.props.appearance ?? "system", ...s,
      expanded: !s.collapsed, closed: !s.visible && !s.trashed,
      ratioName: ratio ? ratio.label : "自由", size, countLabel, isFree: !ratio, options,
      gallery: [0, 1, 2, 5].map((index) => options[index]),
      otherSelected: ![0, 1, 2, 5].includes(s.ratio),
      counts: [1, 2, 3, 4].map(n => ({ n, name: "生成 " + n + " 张", selected: n === s.count, pick: () => this.setCount(n) })),
      ratioMenu: s.menu === "ratio", countMenu: s.menu === "count", actionMenu: s.menu === "actions",
      showRatios: toggle("ratio"), showCounts: toggle("count"), showActions: toggle("actions"),
      dismissMenu: () => this.setState({ menu: "" }),
      collapse: () => this.setState({ collapsed: !s.collapsed, menu: "", confirming: false, x: 0, y: 0 }),
      collapseLabel: s.collapsed ? "展开图片设置" : "收起图片设置",
      close: () => this.setState({ visible: false, menu: "", confirming: false }),
      reopen: () => this.setState({ visible: true, trashed: false, collapsed: false, x: 0, y: 0 }),
      confirmTrash: () => this.setState({ confirming: true, menu: "" }),
      cancelTrash: () => this.setState({ confirming: false }),
      moveToTrash: () => this.setState({ trashed: true, visible: false, confirming: false, status: "" }),
      promptTab: s.tab === "prompt", outputTab: s.tab === "output",
      goPrompt: () => this.setState({ tab: "prompt", menu: "" }),
      goOutput: () => this.setState({ tab: "output", menu: "" }),
      editPrompt: (e) => this.setState({ prompt: e.currentTarget.value, status: "" }),
      pickFree: select(-1),
      editWidth: (e) => this.editPixels("width", e.currentTarget.value),
      editHeight: (e) => this.editPixels("height", e.currentTarget.value),
      normalizeWidth: () => this.setState({ widthText: String(s.width) }),
      normalizeHeight: () => this.setState({ heightText: String(s.height) }),
      commitPixel,
      invalidWidth: !validPixels(s.widthText), invalidHeight: !validPixels(s.heightText), invalid: !isValid,
      disableGenerate: !canGenerate, generateLabel: "生成 " + countLabel + "图片",
      hasStatus: !!s.status,
      generate: () => {
        if (canGenerate) this.setState({ status: "生成预览 · " + countLabel + " · " + size + " px", menu: "" });
      },
      less: () => this.setCount(s.count - 1), more: () => this.setCount(s.count + 1),
      minCount: s.count === 1, maxCount: s.count === 4,
      onStageKey: (e) => {
        if (e.key === "Escape" && (s.menu || s.confirming)) {
          e.stopPropagation();
          this.setState({ menu: "", confirming: false });
        }
      },
      pointerStart: (e) => this.beginDrag(e), pointerMove: (e) => this.moveDrag(e),
      pointerEnd: () => { this.drag = null; }
    };
  }
}
</script>
</body>
</html>
