<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>双入口</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    .empty-canvas {
      background-image: radial-gradient(circle, #dedede 0.7px, transparent 0.9px);
      background-size: 30px 30px;
    }
    .empty-choice:hover { background: #ededed !important; }
    .empty-choice:focus-visible { outline: 2px solid #767676; outline-offset: 3px; }
    .empty-choice:is(:hover, :focus-visible)::after {
      position: absolute;
      z-index: 1;
      top: calc(100% + 7px);
      left: 50%;
      translate: -50% 0;
      padding: 5px 8px;
      border-radius: 6px;
      background: #242424;
      color: #fff;
      font: 12px/16px -apple-system, BlinkMacSystemFont, "PingFang SC", system-ui, sans-serif;
      content: attr(data-tip);
      white-space: nowrap;
      pointer-events: none;
    }
  </style>
</helmet>
<main class="empty-canvas" aria-label="空画布" style="width:840px;height:624px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:0 20px 24px;background-color:#fff;color:#262626;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',system-ui,sans-serif;">
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:280px;max-width:100%;">
    <button type="button" class="empty-choice" data-tip="⌘ O · 也可拖入画布" style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;min-height:106px;padding:12px 8px;border:0;border-radius:11px;background:#f5f5f5;color:#333;font:inherit;cursor:pointer;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-9"></path>
        <path d="m3 16 4-4 4 4 2-2 8 7M17 5l3-3 3 3m-3-3v7"></path>
        <circle cx="8" cy="8" r="1"></circle>
      </svg>
      <span style="font-size:14px;font-weight:520;line-height:20px;white-space:nowrap;">导入图片</span>
    </button>
    <button type="button" class="empty-choice" data-tip="⌘ N" style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;min-height:106px;padding:12px 8px;border:0;border-radius:11px;background:#f5f5f5;color:#333;font:inherit;cursor:pointer;">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        <path d="M12 8v8M8 12h8"></path>
      </svg>
      <span style="font-size:14px;font-weight:520;line-height:20px;white-space:nowrap;">新建图片</span>
    </button>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":840,"height":624}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
